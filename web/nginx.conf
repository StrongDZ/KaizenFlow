# Ứng dụng một trang: đường dẫn nào không phải file có thật thì trả index.html để React Router xử lý.
server {
  listen 80;
  root /usr/share/nginx/html;

  location /static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
