[project]
name = "gauge-twin-ds-sim"
version = "0.1.0"
description = "CPU reference of the video pipeline: RTSP in, FrameResult over ZeroMQ out"
requires-python = ">=3.11,<3.12"
# Versions are the ones installed in sim/ds-sim/Dockerfile; keep both in sync.
dependencies = [
    "numpy==2.1.3",
    "opencv-python-headless==4.10.0.84",
    "onnxruntime==1.20.1",
    "pyzmq==26.2.0",
    "protobuf==5.28.3",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../../gen/python"]
addopts = "-p no:cacheprovider"
