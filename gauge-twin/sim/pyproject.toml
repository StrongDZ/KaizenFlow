[project]
name = "gauge-twin-sim"
version = "0.1.0"
description = "Simulation tools: gauge-renderer, accuracy-eval"
requires-python = ">=3.11,<3.12"
# Versions are the ones installed in tools/Dockerfile; keep both in sync.
# Encoding video also needs the ffmpeg binary with libx264 on PATH.
dependencies = [
    # Must match the protoc release pinned in tools/Dockerfile.
    "protobuf==5.28.3",
    "numpy==2.1.3",
    "opencv-python-headless==4.10.0.84",
    "pillow==11.0.0",
    "pyarrow==18.0.0",
]

[project.scripts]
render = "gauge_renderer.cli:main"

[project.optional-dependencies]
dev = ["pytest==8.3.3", "ruff==0.7.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["gauge-renderer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Code generated by `make proto`.
pythonpath = ["../gen/python", "gauge-renderer"]
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
