# Infrastructure scrape targets. DNS discovery is used for EMQX and Redpanda
# so the same file covers the dev (1 node) and cluster (3 nodes) profiles.
# Application services are added as they are implemented.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: emqx
    metrics_path: /api/v5/prometheus/stats
    dns_sd_configs:
      - names: [emqx]
        type: A
        port: 18083

  - job_name: redpanda
    metrics_path: /public_metrics
    dns_sd_configs:
      - names: [redpanda]
        type: A
        port: 9644

  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]

  - job_name: mediamtx
    static_configs:
      - targets: ["mediamtx:9998"]

  - job_name: mqtt-bridge
    dns_sd_configs:
      - names: [mqtt-bridge]
        type: A
        port: 8080

  - job_name: config-api
    dns_sd_configs:
      - names: [config-api]
        type: A
        port: 8080

  - job_name: ingest
    dns_sd_configs:
      - names: [ingest]
        type: A
        port: 8080

  - job_name: state
    dns_sd_configs:
      - names: [state]
        type: A
        port: 8080

  # Load generator; only present while a load test runs.
  - job_name: edge-sim
    dns_sd_configs:
      - names: [edge-sim]
        type: A
        port: 9100

  # Simulated edge (ds-sim + edge-agent); only present after `make edge-up`.
  - job_name: edge-agent
    dns_sd_configs:
      - names: [edge-agent]
        type: A
        port: 8080

  - job_name: preview-svc
    dns_sd_configs:
      - names: [preview-svc]
        type: A
        port: 8080
