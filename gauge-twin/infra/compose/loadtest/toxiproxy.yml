# Load-test scenario 6 only: ingest reaches TimescaleDB through Toxiproxy so
# the connection can be slowed down. Used by loadtest/scenario-6.sh.
name: gauge-twin-loadtest

services:
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    restart: unless-stopped
    cpus: 2
    mem_limit: 512m
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ./toxiproxy.json:/config/toxiproxy.json:ro
    networks:
      gauge-twin:
        aliases: [toxiproxy]

networks:
  gauge-twin:
    external: true
