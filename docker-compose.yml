services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_PASSWORD: kaizen
      POSTGRES_DB: kaizenflow
    ports: ["5433:5432"]
    command: ["postgres", "-c", "timescaledb.telemetry_level=off"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30
  sim:
    build: services/sim
    environment:
      SIM_WORKERS: "6"   # dự báo dài (vài ngày × 20 lần lặp) chia đều cho các lõi; giảm nếu máy ít lõi
    ports: ["8081:8081"]
  api:
    build: services/api
    environment:
      KF_DB_URL: postgres://postgres:kaizen@db:5432/kaizenflow?sslmode=disable
      KF_SIM_URL: http://sim:8081
      KF_ADDR: ":8080"
      KF_FEED_URL: http://feed:8090
    ports: ["8080:8080"]
    depends_on:
      db: {condition: service_healthy}
      sim: {condition: service_started}
  feed:
    build: {context: ., dockerfile: services/feed/Dockerfile}
    environment:
      KF_API_URL: http://api:8080
    ports: ["8090:8090"]
  # Cầu nối số đọc đồng hồ của gauge-twin vào live twin: đọc query-api của gauge-twin rồi POST
  # /api/ingest như một nguồn dữ liệu. gauge-twin chạy stack riêng (thường ngoài compose này) nên
  # địa chỉ mặc định trỏ ra host; đổi bằng GAUGE_QUERY_URL. gauge-twin không phải sửa gì.
  gauge-bridge:
    build: {context: ., dockerfile: services/gauge-bridge/Dockerfile}
    environment:
      KF_API_URL: http://api:8080
      GAUGE_QUERY_URL: ${GAUGE_QUERY_URL:-http://host.docker.internal:8097}
      GAUGE_BRIDGE_INTERVAL_S: "5"
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      api: {condition: service_started}
volumes:
  dbdata: {}
