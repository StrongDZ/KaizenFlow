[project]
name = "kaizenflow-gauge-bridge"
version = "0.1.0"
description = "Cầu nối số đọc đồng hồ của gauge-twin vào live twin của KaizenFlow (/api/ingest)."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gauge_bridge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
