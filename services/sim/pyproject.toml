[project]
name = "kaizenflow-sim"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "simpy>=4.1",
  "numpy>=1.26",
  "pydantic>=2.7",
  "fastapi>=0.111",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sim_service*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
